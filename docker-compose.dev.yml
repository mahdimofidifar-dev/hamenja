services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev

    container_name: client

    ports:
      - "5173:5173"

    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_UPLOAD_URL=http://localhost:5000

    volumes:
      - ./client:/app
      - /app/node_modules

    depends_on:
      - server

    networks:
      - app-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev

    container_name: server

    ports:
      - "5000:5000"

    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URL=mongodb://database:27017/db
      - JWT_ACCESS_SECRET=your-long-random-secret
      - JWT_REFRESH_SECRET=your-long-random-refresh-secret

    volumes:
      - ./server:/app
      - /app/node_modules

    depends_on:
      - database

    networks:
      - app-network

  database:
    image: mongo:latest

    container_name: database

    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongo_data_dev:/data/db

    networks:
      - app-network

volumes:
  mongo_data_dev:

networks:
  app-network:
    driver: bridge
